schema_version = "1.3"
artifacts = ["/app/submission"]

[task]
name = "collinear-candidate/chart-capacity-audit-v5"
description = "Reconcile charts and telemetry epochs, then optimize static capacity, a timed rollout, and a nonanticipative two-stage policy with shared observation uncertainty."
keywords = ["visual-reasoning", "operations", "charts", "reconciliation", "optimization"]

[metadata]
category = "data-analysis"
difficulty = "hard"
revision = 5
provenance = "Original synthetic chart-only operations scenario; new data, revision history, counter resets, histograms and planning constraints. Extends this exercise's v1 exercise."
network_policy = "Network for harness setup/inference only. Report, viewer, oracle and verifier work offline."
image_access_requirement = "Native PNG image access or image-capable browser required. Text-only access is not a valid chart reasoning trial."

[agent]
timeout_sec = 10800

[verifier]
timeout_sec = 1800

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"
