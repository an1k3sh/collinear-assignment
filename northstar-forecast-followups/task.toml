schema_version = "1.3"
multi_step_reward_strategy = "mean"

[task]
name = "collinear-candidate/northstar-forecast-followups"
description = "Six resumed finance milestones: growth forecast, cohort revision, stress continuation, treasury detour, renewal-pricing revision and reconciled cutover."
keywords = ["finance", "spreadsheets", "multi-step", "session-resume", "revisions"]

[metadata]
category = "finance"
difficulty = "hard"
network_policy = "Runtime finance work and verification need no network. Public access supports harness setup/inference; build uses frozen Debian snapshots and pinned Python dependencies."
provenance = "New staged experiment extending the synthetic Northstar workbook created in this exercise; no public benchmark, real financial data or prior unrelated task copied."
experiment = "Successive instructions issued only after each prior agent turn, preserving filesystem and using native session resume when --resume-trajectory is supplied. Not asynchronous mid-tool interruption."

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 900

[environment]
build_timeout_sec = 1800
cpus = 2
memory_mb = 4096
storage_mb = 8192
network_mode = "public"

[[steps]]
name = "01-growth"
artifacts = ["/app/output"]
[steps.verifier.env]
PHASE = "1"

[[steps]]
name = "02-cohort-revision"
artifacts = ["/app/output"]
[steps.verifier.env]
PHASE = "2"

[[steps]]
name = "03-liquidity-continuation"
artifacts = ["/app/output"]
[steps.verifier.env]
PHASE = "3"

[[steps]]
name = "04-treasury-detour"
artifacts = ["/app/output"]
[steps.verifier.env]
PHASE = "4"

[[steps]]
name = "05-renewal-pricing"
artifacts = ["/app/output"]
[steps.verifier.env]
PHASE = "5"

[[steps]]
name = "06-reconciled-cutover"
artifacts = ["/app/output"]
[steps.verifier.env]
PHASE = "6"
