schema_version = "1.3"
artifacts = ["/app/submission"]

[task]
name = "collinear-candidate/pdf-word-contract-reconstruction"
description = "Reconstruct a published procurement PDF as an editable Word document, judged against the original source by a vision-capable LLM."
keywords = ["pdf", "docx", "document-reconstruction", "multimodal", "llm-judge"]

[metadata]
category = "document-processing"
difficulty = "hard"
provenance = "Original fictional procurement agreement authored as DOCX and exported to PDF for this exercise."
network_policy = "Build, solver inference and GPT-6.1 Sol high judging require network. Document processing is offline. Judge uses separately supplied DOCX_JUDGE_TOKEN through Copilot CLI."

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 1800

[verifier.env]
GH_TOKEN = "${DOCX_JUDGE_TOKEN}"

[environment]
build_timeout_sec = 900
cpus = 4
memory_mb = 6144
storage_mb = 10240
network_mode = "public"
