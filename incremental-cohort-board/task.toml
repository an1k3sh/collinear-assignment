schema_version = "1.3"
multi_step_reward_strategy = "final"
artifacts = [{source = "/app", exclude = ["**/__pycache__/**", "**/*.pyc"]}]

[task]
name = "collinear-candidate/incremental-cohort-board"
description = "Repair persistent incremental analytics across four releases, including dynamic household equivalence and retractable distinct counts, without regressing SQL or transaction semantics."
keywords = ["incremental-computation", "sqlite", "analytics", "regression", "multi-step"]

[metadata]
category = "software-engineering"
difficulty = "hard"
provenance = "New fictional application, incident records, implementation, oracle and verifier authored for this exercise. No benchmark or public issue port."
revision = 2
network_policy = "Pinned image acquisition and CLI installation/inference need network. Application, oracle and verifier need no network, secrets or external data."

[agent]
timeout_sec = 5400

[verifier]
timeout_sec = 240

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"

[[steps]]
name = "release-1"

[[steps]]
name = "release-2"

[[steps]]
name = "release-3"

[[steps]]
name = "release-4"
