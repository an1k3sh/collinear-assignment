schema_version = "1.3"
artifacts = ["/app/submission"]

[task]
name = "collinear-candidate/disclosure-packet-release"
description = "Prepare a privacy-safe financial disclosure PDF while preserving public statement content, navigation and usable supporting attachments."
keywords = ["document-forensics", "finance", "pdf", "privacy", "spreadsheet"]

[metadata]
category = "data-processing"
difficulty = "hard"
provenance = "Original fictional financial packet, synthetic customer identifiers, original worksheets, oracle and verifier created for this exercise."
network_policy = "Build dependencies and agent setup/inference use network. The document task and verification are offline."

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 600
cpus = 4
memory_mb = 4096
storage_mb = 8192
network_mode = "public"
