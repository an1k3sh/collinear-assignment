schema_version = "1.3"
artifacts = ["/app/submission"]

[task]
name = "collinear-candidate/settlement-cutoff-reconciliation"
description = "Reconcile processor settlements, reserves and aging across scoped IDs, revisions and reporting cutoffs."
keywords = ["finance", "reconciliation", "cutoff", "receivables"]

[metadata]
category = "data-analysis"
difficulty = "medium"
provenance = "Original synthetic financial records and explicit close policy; no private data or copied benchmark."
network_policy = "Network for image acquisition and agent setup/inference only; task/verifier are offline."
prototype = true

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 300

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"
