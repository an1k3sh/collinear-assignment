schema_version = "1.3"
artifacts = ["/app/stockroom", "/app/workflows", "/app/deliverable"]

[task]
name = "collinear-candidate/stockroom-durable"
description = "Construct a typed warehouse DSL with portable durable continuations inside transactions, loops and recovery handlers."
keywords = ["dsl", "interpreters", "transactions", "durable-workflows", "continuations"]

[metadata]
category = "software-engineering"
difficulty = "hard"
network_policy = "No network, secrets, or external data needed by the task; harness inference/setup may use network."
provenance = "New synthetic language, implementation, fixtures and tests created for this assignment; not a port of a public benchmark."
revision = 2

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 600

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"
