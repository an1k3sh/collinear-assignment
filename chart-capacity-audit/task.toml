schema_version = "1.3"
artifacts = ["/app/submission"]

[task]
name = "collinear-candidate/chart-capacity-audit"
description = "Audit a chart-only operations report, recover uncertain observations, and produce a reproducible capacity decision with robust evidence."
keywords = ["visual-reasoning", "charts", "data-analysis", "uncertainty", "audit"]

[metadata]
category = "data-analysis"
difficulty = "hard"
revision = 1
provenance = "Original synthetic dataset, raster charts, draft memo, allocation policy and functional verifier created for this exercise."
network_policy = "Public egress only for harness setup/inference. Task, image viewer, analysis and verifier work offline."
image_access_requirement = "Agent must have native PNG viewing or a browser capable of displaying the local report. Missing image access is an invalid trial, not a reasoning failure."

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 180

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"
