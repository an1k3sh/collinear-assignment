schema_version = "1.3"
artifacts = ["/app/stockroom", "/app/workflows", "/app/deliverable", "/app/carrier"]

[task]
name = "collinear-candidate/stockroom-carrier"
description = "Construct a durable warehouse DSL and reconcile local transactions against an independently committed carrier receipt ledger."
keywords = ["dsl", "interpreters", "transactions", "idempotency", "incident-recovery"]

[metadata]
category = "software-engineering"
difficulty = "hard"
network_policy = "No network, secrets, or external data needed by the task; harness inference/setup may use network."
provenance = "New synthetic language, implementation, fixtures and tests created for this assignment; not a port of a public benchmark."
revision = 3

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 600

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"
