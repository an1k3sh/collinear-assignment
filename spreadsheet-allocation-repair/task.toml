schema_version = "1.3"
artifacts = ["/app/submission"]

[task]
name = "collinear-candidate/spreadsheet-allocation-repair"
description = "Repair a real XLSX workbook with stale caches, wrong lookups, pasted formulas, truncated source ranges and stale chart bindings."
keywords = ["spreadsheet", "xlsx", "formula-repair", "charts"]

[metadata]
category = "data-analysis"
difficulty = "medium"
provenance = "Original synthetic XLSX created using openpyxl; all financial data invented for this exercise."
network_policy = "Build downloads pinned Python dependencies and Debian snapshot LibreOffice packages; task/verifier run offline."
prototype = true

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 600

[environment]
build_timeout_sec = 1200
cpus = 2
memory_mb = 3072
storage_mb = 6144
network_mode = "public"
