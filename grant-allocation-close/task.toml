schema_version = "1.3"
artifacts = ["/app/submission"]

[task]
name = "collinear-candidate/grant-allocation-close"
description = "Repair a formula-driven grant close workbook: reconcile a versioned expense ledger and allocate a capped weighted budget exactly to cents."
keywords = ["spreadsheet", "finance", "reconciliation", "allocation"]

[metadata]
category = "finance"
difficulty = "hard"
provenance = "Original fictional grant program, workbook, policy, ledgers, oracle and verifier created for this exercise."
network_policy = "Network for pinned build dependencies and agent setup/inference only. Workbook calculations and verifier are offline."

[agent]
timeout_sec = 7200

[verifier]
timeout_sec = 600

[environment]
build_timeout_sec = 600
cpus = 4
memory_mb = 4096
storage_mb = 8192
network_mode = "public"
