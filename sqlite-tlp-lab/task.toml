schema_version = "1.3"
artifacts = ["/app/tlp", "/app/reports"]

[task]
name = "collinear-candidate/sqlite-tlp-lab"
description = "Implement all ten bounded TLP oracle families, including GROUP BY and HAVING, with semantic generator coverage and replayable mismatch evidence."
keywords = ["sqlite", "metamorphic-testing", "tlp", "fuzzing", "code-generation"]

[metadata]
category = "software-engineering"
difficulty = "hard"
revision = 2
diagnostics_revision = 1
provenance = "Original scaffold, bounded AST, conformance suite and oracle. TLP is established prior art, not a new algorithm."
network_policy = "Public egress is available for agent harness setup and inference only. Application and verifier are entirely local."

[agent]
timeout_sec = 3600

[verifier]
timeout_sec = 180

[environment]
build_timeout_sec = 600
cpus = 2
memory_mb = 2048
storage_mb = 4096
network_mode = "public"
